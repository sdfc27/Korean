<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVA 韓文手札｜母音・子音・終聲・七大分類</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-paper: #FAF7F2;
      --bg-card: #FFFFFF;
      --border-hair: #E6DFD5;
      --ink-main: #2B2623;
      --ink-muted: #78716C;
      --accent-sage: #4A6B5D;
      --accent-terra: #C66B4F;
      --accent-indigo: #4B5B76;
    }
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: var(--bg-paper);
      background-image: radial-gradient(#DFD7CB 0.85px, transparent 0.85px);
      background-size: 20px 20px;
      color: var(--ink-main);
      -webkit-font-smoothing: antialiased;
    }
    .serif-title {
      font-family: 'Noto Serif TC', serif;
    }
    .kr {
      font-family: 'Noto Sans KR', sans-serif;
    }
    .card-paper {
      background: var(--bg-card);
      border: 1px solid var(--border-hair);
      box-shadow: 0 2px 14px rgba(43, 38, 35, 0.035);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .card-paper:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(43, 38, 35, 0.07);
      border-color: #D5CBBF;
    }
    .tab-btn {
      color: #6B635B;
      border-bottom: 2px solid transparent;
      transition: all 0.18s ease;
    }
    .tab-btn:hover {
      color: #2B2623;
    }
    .tab-btn.active {
      color: #2B2623;
      border-bottom-color: #C66B4F;
      font-weight: 600;
    }
    .pill-btn {
      color: #6B635B;
      transition: all 0.15s ease;
    }
    .pill-btn.active {
      background-color: #2B2623;
      color: #FAF7F2;
      box-shadow: 0 2px 6px rgba(43, 38, 35, 0.15);
    }
    canvas {
      touch-action: none;
    }
    /* Custom subtle scrollbar */
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-thumb { background: #D6CEC2; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-[#FAF7F2]/92 backdrop-blur-md border-b border-[#E6DFD5]">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 pt-4 pb-0 flex flex-col gap-3.5">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3.5">
          <div class="w-11 h-11 rounded-2xl bg-[#2B2623] text-[#FAF7F2] flex items-center justify-center font-bold text-xl kr shadow-sm tracking-tight">한</div>
          <div>
            <h1 class="text-lg sm:text-xl font-bold text-[#2B2623] serif-title tracking-wide">EVA 韓文課複習手札</h1>
            <p class="text-xs text-[#78716C] mt-0.5">10/15 – 11/12 課堂講義與筆記系統化整理</p>
          </div>
        </div>

        <div class="flex items-center gap-2.5 w-full sm:w-auto">
          <div class="relative flex-1 sm:w-64">
            <svg class="w-4 h-4 text-[#9C948B] absolute left-3.5 top-2.5 pointer-events-none" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/></svg>
            <input id="searchInput" type="search" placeholder="搜尋字母、注音、單字或中文..." class="w-full pl-9 pr-3.5 py-2 text-sm rounded-full border border-[#E2DAD0] bg-white/90 text-[#2B2623] placeholder-[#A8A096] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#C66B4F]/30 focus:border-[#C66B4F]" />
          </div>
          <button id="speedToggleBtn" type="button" class="px-3 py-2 text-xs font-medium rounded-full border border-[#E2DAD0] bg-white hover:bg-[#FDF8F2] text-[#4A433D] flex items-center gap-1 whitespace-nowrap transition shadow-2xs" title="切換發音語速">
            <span id="speedLabel">語速：慢 0.55x</span>
          </button>
          <button id="bookmarkFilterBtn" type="button" class="px-3.5 py-2 text-xs font-medium rounded-full border border-[#E2DAD0] bg-white hover:bg-[#FDF8F2] text-[#4A433D] flex items-center gap-1.5 whitespace-nowrap transition shadow-2xs">
            <svg class="w-3.5 h-3.5 text-[#C66B4F]" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            <span class="hidden sm:inline">待複習</span>
            <span id="bookmarkCount" class="px-1.5 py-0.5 text-[11px] rounded-full bg-[#F4ECE4] text-[#9A4E36] font-semibold">0</span>
          </button>
        </div>
      </div>

      <!-- Clean Editorial Underline Tabs -->
      <nav class="flex items-center gap-5 sm:gap-7 overflow-x-auto no-scrollbar" aria-label="主要單元">
        <button type="button" data-tab="vowels" class="tab-btn active py-2.5 text-sm whitespace-nowrap">一、母音 <span class="text-xs opacity-60 ml-0.5">21</span></button>
        <button type="button" data-tab="consonants" class="tab-btn py-2.5 text-sm whitespace-nowrap">二、子音 <span class="text-xs opacity-60 ml-0.5">19</span></button>
        <button type="button" data-tab="batchim" class="tab-btn py-2.5 text-sm whitespace-nowrap">三、終聲與雙收尾音</button>
        <button type="button" data-tab="classification" class="tab-btn py-2.5 text-sm whitespace-nowrap">四、七種終聲分類</button>
        <button type="button" data-tab="quiz" class="tab-btn py-2.5 text-sm whitespace-nowrap">隨堂測驗</button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-7">
    <!-- Bookmark Filter Banner -->
    <div id="bookmarkBanner" class="hidden mb-6 p-3.5 rounded-2xl bg-[#FDF6EC] border border-[#EED9BD] flex items-center justify-between gap-3">
      <div class="text-xs sm:text-sm text-[#7C5329] flex items-center gap-2">
        <span class="font-semibold">僅顯示已收藏的「待複習」項目</span>
        <span class="hidden sm:inline text-[#9A7248]">（點擊卡片右上角星號即可切換）</span>
      </div>
      <button id="clearBookmarkFilterBtn" type="button" class="text-xs font-medium px-3 py-1.5 rounded-full bg-white border border-[#E4CAA7] text-[#7C5329] hover:bg-[#FAF0E2] transition">顯示全部</button>
    </div>

    <!-- Section 1: Vowels -->
    <section id="sec-vowels" class="space-y-7">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <span class="text-[11px] font-semibold uppercase tracking-widest text-[#C66B4F]">Chapter 01 · Vowels</span>
          <h2 class="text-2xl font-bold text-[#2B2623] serif-title mt-0.5">母音 (모음) — 10 基本 ＋ 11 複合</h2>
          <p class="text-sm text-[#78716C] mt-1">點擊單字或喇叭圖示即可聆聽標準發音，點「筆順練習」可在方格畫布上描紅。</p>
        </div>
        <div class="flex items-center gap-1 bg-[#EFEAE2] p-1 rounded-full">
          <button type="button" data-vfilter="all" class="pill-btn active px-3.5 py-1.5 rounded-full text-xs font-medium">全部 21</button>
          <button type="button" data-vfilter="basic" class="pill-btn px-3.5 py-1.5 rounded-full text-xs font-medium">基本 10</button>
          <button type="button" data-vfilter="compound" class="pill-btn px-3.5 py-1.5 rounded-full text-xs font-medium">複合 11</button>
        </div>
      </div>

      <div id="vowelsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

      <!-- Special Callout: 의 3 rules & Kinship notes from 11/05 -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 pt-2">
        <div class="card-paper rounded-2xl p-6">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-[#2B2623] serif-title text-base">課堂重點：「의」的三種發音規則</h3>
            <span class="text-[11px] px-2.5 py-0.5 rounded-full bg-[#EEF2F6] text-[#4B5B76] font-medium">11/05 筆記</span>
          </div>
          <div class="space-y-2.5 text-sm">
            <div class="p-3.5 rounded-xl bg-[#FAF7F2] border border-[#EDE6DC] flex items-center justify-between gap-3">
              <div>
                <span class="font-bold kr text-base text-[#4B5B76] mr-1.5">1. [의]</span>
                <span class="text-[#575049]">位在第一個字：</span>
                <span class="kr font-semibold text-[#2B2623]">의사</span>(醫生)、<span class="kr font-semibold text-[#2B2623]">의자</span>(椅子)、<span class="kr font-semibold text-[#2B2623]">의지</span>、<span class="kr font-semibold text-[#2B2623]">의외</span>
              </div>
              <button type="button" onclick="speakKr('의사, 의자')" class="shrink-0 w-8 h-8 rounded-full bg-white border border-[#E6DFD5] flex items-center justify-center text-[#4B5B76] hover:bg-[#EEF2F6]" title="朗讀">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07"/></svg>
              </button>
            </div>
            <div class="p-3.5 rounded-xl bg-[#FAF7F2] border border-[#EDE6DC] flex items-center justify-between gap-3">
              <div>
                <span class="font-bold kr text-base text-[#4B5B76] mr-1.5">2. [이]</span>
                <span class="text-[#575049]">非第一個字：</span>
                <span class="kr font-semibold text-[#2B2623]">예의</span> <span class="text-[#78716C]">[예이]</span> (禮貌)
              </div>
              <button type="button" onclick="speakKr('예의')" class="shrink-0 w-8 h-8 rounded-full bg-white border border-[#E6DFD5] flex items-center justify-center text-[#4B5B76] hover:bg-[#EEF2F6]" title="朗讀">
                <sv
